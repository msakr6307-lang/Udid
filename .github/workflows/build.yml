name: iOS Dylib Cloud Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential xz-utils curl git clang unzip lzma liblzma-dev

    - name: Setup Theos Environment
      run: |
        export THEOS=/opt/theos
        sudo git clone --recursive https://github.com/theos/theos.git $THEOS
        sudo chown -R $(whoami) $THEOS
        echo "THEOS=/opt/theos" >> $GITHUB_ENV
        
    - name: Install Linux iOS Toolchain
      run: |
        mkdir -p /opt/theos/toolchain
        # تحميل المترجم المعتمد من سورس الأداة الرسمي للينكس
        curl -LO https://github.com/theos/toolchain/releases/download/linux-arm64/toolchain-linux-arm64.tar.xz
        tar -xf toolchain-linux-arm64.tar.xz -C /opt/theos/toolchain/ --strip-components=1
        rm toolchain-linux-arm64.tar.xz
        
    - name: Setup iOS SDK
      run: |
        git clone https://github.com/theos/sdks.git /opt/theos/sdks-master
        mkdir -p /opt/theos/sdks
        cp -r /opt/theos/sdks-master/iPhoneOS16.5.sdk /opt/theos/sdks/
        rm -rf /opt/theos/sdks-master
        
    - name: Compile Dylib
      run: |
        export THEOS=/opt/theos
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        
    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Compiled-Dylib
        path: .theos/obj/**/Udid.dylib
