name: iOS Dylib Cloud Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential xz-utils curl git clang

    - name: Setup Theos Environment
      run: |
        export THEOS=/opt/theos
        sudo git clone --recursive https://github.com/theos/theos.git $THEOS
        sudo chown -R $(whoami) $THEOS
        
    - name: Install Toolchain & ldid
      run: |
        sudo mkdir -p /opt/theos/toolchain
        sudo curl -LO https://github.com/theos/toolchain/releases/download/linux-arm64/toolchain-linux-arm64.tar.xz
        sudo tar -xf toolchain-linux-arm64.tar.xz -C /opt/theos/toolchain/ --strip-components=1
        sudo curl -sL "https://github.com/theos/ldid/releases/download/v2.1.5/ldid_linux_x86_64" -o /usr/local/bin/ldid
        sudo chmod +x /usr/local/bin/ldid
        
    - name: Setup iOS SDK
      run: |
        git clone https://github.com/theos/sdks.git /opt/theos/sdks-master
        mkdir -p /opt/theos/sdks
        cp -r /opt/theos/sdks-master/iPhoneOS16.5.sdk /opt/theos/sdks/
        
    - name: Compile Dylib
      run: |
        export THEOS=/opt/theos
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        
    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Compiled-Dylib
        path: .theos/obj/debug/*.dylib
