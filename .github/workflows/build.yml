name: iOS Dylib Cloud Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential xz-utils curl git clang unzip

    - name: Setup Theos & Toolchain
      run: |
        bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        echo "THEOS=/home/runner/theos" >> $GITHUB_ENV
        
    - name: Setup iOS SDK
      run: |
        git clone https://github.com/theos/sdks.git /home/runner/theos/sdks-master
        mkdir -p /home/runner/theos/sdks
        cp -r /home/runner/theos/sdks-master/iPhoneOS16.5.sdk /home/runner/theos/sdks/
        
    - name: Compile Dylib
      run: |
        export THEOS=/home/runner/theos
        make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        
    - name: Upload Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: iOS-Compiled-Dylib
        path: .theos/obj/debug/*.dylib
